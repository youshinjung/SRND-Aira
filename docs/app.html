<!DOCTYPE html>
<html lang="ko" class="noicons"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AIRA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=swap" rel="stylesheet"/>
<style>

/* ============================================================
   AIRA Design Tokens — single source of truth
   ============================================================ */
:root{
  /* elevation planes */
  --bg:#F7F7F5;
  --surface:#FFFFFF;
  --surface-2:#F9FAFB;
  --surface-3:#F3F4F6;
  --line:#E5E7EB;
  --line-2:#D8DBE0;

  /* brand */
  --navy:#12306E;
  --navy-deep:#0B1F4B;
  --blue:#2563EB;
  --blue-tint:#EEF3FE;
  --brand-grad:linear-gradient(135deg,#12306E 0%,#2563EB 100%);

  /* ink */
  --ink:#151719;
  --ink-2:#4B5057;
  --ink-3:#868C95;

  /* semantic */
  --teal:#0F9D8F; --teal-tint:#E6F6F4;
  --amber:#B45309; --amber-tint:#FEF3E2;
  --red:#BA1A1A;   --red-tint:#FDECEC;

  /* shape */
  --r-card:10px; --r-ctl:8px; --r-chip:999px;
  --shadow:0 1px 3px rgba(16,24,40,.05),0 1px 2px rgba(16,24,40,.03);
  --shadow-pop:0 12px 32px rgba(11,31,75,.14),0 2px 8px rgba(11,31,75,.06);

  /* layout */
  --topbar:64px; --pad:24px;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  font-size:14px; line-height:1.5; letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
table{border-collapse:collapse;width:100%}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.msi{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;
  font-size:20px;line-height:1;letter-spacing:normal;display:inline-block;
  -webkit-font-feature-settings:'liga';font-feature-settings:'liga';user-select:none;flex:none}
.msi.sm{font-size:18px} .msi.xs{font-size:16px} .msi.lg{font-size:24px}
/* icon font not yet (or never) loaded -> reserve the box, never show ligature text */
html.noicons .msi{font-size:0 !important;width:20px;height:20px}
html.noicons .msi.sm{width:18px;height:18px}
html.noicons .msi.xs{width:16px;height:16px}
html.noicons .msi.lg{width:24px;height:24px}

/* ============================================================
   Type scale
   ============================================================ */
.t-display{font-size:26px;font-weight:700;line-height:1.25;letter-spacing:-.022em}
.t-h1{font-size:22px;font-weight:700;line-height:1.3;letter-spacing:-.018em}
.t-h2{font-size:16px;font-weight:650;line-height:1.4;letter-spacing:-.012em}
.t-body{font-size:14px;font-weight:400}
.t-strong{font-size:14px;font-weight:600}
.t-sm{font-size:13px}
.t-label{font-size:12px;font-weight:550;line-height:1.35}
.t-micro{font-size:11px;font-weight:550;letter-spacing:.02em}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}

/* ============================================================
   Logo lockup — one component, three sizes
   ============================================================ */
.logo{display:flex;align-items:center;gap:9px;min-width:0}
.logo img{display:block;height:var(--mark,26px);width:auto}
.logo .wm{display:flex;flex-direction:column;justify-content:center;min-width:0}
.logo .wm b{font-size:var(--wm,17px);font-weight:750;color:var(--navy);
  letter-spacing:.06em;line-height:1.05}
.logo .wm span{font-size:9.5px;font-weight:550;color:var(--ink-3);
  letter-spacing:.11em;line-height:1.3;margin-top:2px;white-space:nowrap}
.logo--lg{--mark:56px;--wm:0}
.logo--lg img{height:56px}

/* ============================================================
   Primitives
   ============================================================ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  box-shadow:var(--shadow)}
.card__head{padding:14px 20px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.card__body{padding:20px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:40px;padding:0 18px;border-radius:var(--r-ctl);
  font-size:13.5px;font-weight:650;letter-spacing:-.01em;
  transition:filter .14s,background .14s,border-color .14s,box-shadow .14s;white-space:nowrap}
.btn .msi{font-size:18px}
.btn--primary{background:var(--brand-grad);color:#fff;box-shadow:0 1px 2px rgba(11,31,75,.24)}
.btn--primary:hover{filter:brightness(1.09)}
.btn--secondary{background:var(--surface);border:1px solid var(--line);color:var(--navy)}
.btn--secondary:hover{background:var(--surface-2);border-color:var(--line-2)}
.btn--ghost{color:var(--ink-2)}
.btn--ghost:hover{background:var(--surface-3);color:var(--ink)}
.btn--danger{color:var(--red)} .btn--danger:hover{background:var(--red-tint)}
.btn--sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:6px}
.btn--sm .msi{font-size:16px}
.btn[disabled]{opacity:.42;pointer-events:none;filter:grayscale(.4)}

.field{display:flex;flex-direction:column;gap:6px}
.field > label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.input,select.input{height:40px;width:100%;padding:0 12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-ctl);font-size:13.5px;
  transition:border-color .13s,box-shadow .13s}
.input::placeholder{color:#B3B8C0}
.input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.13)}
select.input{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%23868C95' stroke-width='1.8'><path d='M4 6.5 8 10.5 12 6.5'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;padding-right:30px}
.search{position:relative}
.search .msi{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:19px}
.search .input{padding-left:36px}

.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 11px;
  border-radius:var(--r-chip);font-size:11.5px;font-weight:650;letter-spacing:-.005em;white-space:nowrap}
.chip--teal{background:var(--teal-tint);color:#0A6E64}
.chip--amber{background:var(--amber-tint);color:#8A4108}
.chip--red{background:var(--red-tint);color:#9B1414}
.chip--blue{background:var(--blue-tint);color:var(--navy)}
.chip--grey{background:var(--surface-3);color:var(--ink-2)}

.tab{height:32px;padding:0 14px;border-radius:var(--r-chip);border:1px solid var(--line);
  background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink-2);
  display:inline-flex;align-items:center;gap:6px;transition:.13s}
.tab:hover{background:var(--surface-2)}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tab .cnt{font-size:11px;opacity:.62;font-variant-numeric:tabular-nums}

.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;
  border-radius:var(--r-ctl);font-size:12.5px;line-height:1.55}
.note .msi{font-size:18px;flex:none;margin-top:1px}
.note--info{background:var(--surface-3);color:var(--ink-2)}
.note--warn{background:var(--amber-tint);color:#8A4108}
.note--blue{background:var(--blue-tint);color:var(--navy)}

/* data table */
.tbl thead th{background:var(--surface-2);font-size:11.5px;font-weight:650;color:var(--ink-2);
  text-align:left;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap;
  letter-spacing:.01em}
.tbl tbody td{padding:0 16px;height:48px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .r{text-align:right} .tbl .c{text-align:center}
.tbl .nowrap{white-space:nowrap}


/* ============================================================
   Modal + auth
   ============================================================ */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(21,23,25,.42);
  backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;padding:24px}
.scrim.on{display:flex;animation:fade .18s ease both}
.modal{width:100%;max-width:428px;background:var(--surface);border-radius:14px;
  box-shadow:var(--shadow-pop);overflow:hidden;animation:pop .24s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.modal__head{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--surface-2);
  display:flex;align-items:center;justify-content:space-between}
.modal__body{padding:30px 24px 26px;text-align:center}
.modal__foot{padding:12px 20px;border-top:1px solid var(--line);background:var(--surface-2);
  display:flex;align-items:center;justify-content:space-between;gap:12px}

.authnum{width:120px;height:120px;margin:20px auto 0;border-radius:14px;
  border:2px solid var(--navy);background:var(--surface-2);
  display:grid;place-items:center;font-size:46px;font-weight:750;color:var(--navy);
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
  box-shadow:inset 0 1px 0 #fff,0 2px 10px rgba(11,31,75,.07)}
.authtimer{margin-top:16px;display:inline-flex;align-items:center;gap:6px;
  font-size:14px;font-weight:650;color:var(--blue);font-variant-numeric:tabular-nums}
.authtimer.warn{color:var(--amber)}
.authbar{width:200px;height:3px;border-radius:3px;background:var(--line);margin:12px auto 0;overflow:hidden}
.authbar i{display:block;height:100%;background:var(--blue);transition:width 1s linear}
.authbar.warn i{background:var(--amber)}

/* ============================================================
   Upload
   ============================================================ */
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r-card);background:var(--surface);
  padding:46px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:border-color .16s,background .16s}
.drop:hover,.drop.hot{border-color:var(--blue);background:var(--blue-tint)}
.drop .ic{width:52px;height:52px;border-radius:50%;background:var(--blue-tint);
  display:grid;place-items:center;margin-bottom:4px}
.drop .ic .msi{font-size:24px;color:var(--blue)}
.drop h3{font-size:15px;font-weight:650;color:var(--navy)}
.drop p{font-size:12.5px;color:var(--ink-3)}

.filerow{display:flex;align-items:center;gap:12px;padding:0 20px;height:56px;
  border-bottom:1px solid var(--line);animation:fade .2s ease both}
.filerow:last-of-type{border-bottom:0}
.filerow .fic{width:32px;height:32px;border-radius:7px;background:var(--blue-tint);
  display:grid;place-items:center;flex:none}
.filerow .fic .msi{font-size:17px;color:var(--blue)}
.filerow .meta{flex:1;min-width:0}
.filerow .meta b{display:block;font-size:13px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filerow .meta span{display:block;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.addfile{margin:12px 20px 16px;height:44px;width:calc(100% - 40px);border:1px dashed var(--line-2);
  border-radius:var(--r-ctl);color:var(--ink-2);font-size:13px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px;transition:.14s}
.addfile:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-tint)}

/* sticky action bar */
.actionbar{position:sticky;bottom:0;margin:24px calc(var(--pad) * -1) -64px;
  padding:14px var(--pad);background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(10px);border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:16px;z-index:20}
.actionbar .hint{font-size:12px;color:var(--ink-3)}
.actionbar .grp{display:flex;align-items:center;gap:10px;margin-left:auto}

/* ============================================================
   Progress
   ============================================================ */
.runcard{width:100%;max-width:560px}
.runcard .card__body{padding:30px 30px 26px}
.steps{display:flex;flex-direction:column;position:relative;padding-left:4px}
.step{display:flex;gap:14px;padding:0 0 4px}
.step__rail{width:22px;display:flex;flex-direction:column;align-items:center;flex:none}
.step__ic{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);flex:none;
  display:grid;place-items:center;background:var(--surface);transition:.24s}
.step__ic .msi{font-size:13px;color:#fff;opacity:0;transition:opacity .2s}
.step__ln{flex:1;width:2px;background:var(--line);margin:3px 0;min-height:16px;transition:background .3s}
.step:last-child .step__ln{display:none}
.step__bd{display:block;flex:1;padding-bottom:16px;min-width:0}
.step__row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.step__nm{display:block;font-size:13.5px;font-weight:600;color:var(--ink-3);transition:.24s}
.step__t{display:block;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .3s}
.step[data-s="done"] .step__ic{background:var(--teal);border-color:var(--teal)}
.step[data-s="done"] .step__ic .msi{opacity:1}
.step[data-s="done"] .step__nm{color:var(--teal);font-weight:600}
.step[data-s="done"] .step__t{opacity:1}
.step[data-s="done"] .step__ln{background:var(--teal)}
.step[data-s="run"] .step__ic{border-color:var(--blue);border-right-color:transparent;
  animation:spin .8s linear infinite}
.step[data-s="run"] .step__nm{color:var(--navy);font-weight:700}
.step__prog{display:block;height:4px;border-radius:4px;background:var(--line);margin-top:9px;overflow:hidden;
  max-height:0;opacity:0;transition:max-height .25s,opacity .25s,margin .25s}
.step[data-s="run"] .step__files .step__prog{max-height:10px;opacity:1}
.step__prog i{display:block;height:100%;width:0;background:var(--brand-grad);transition:width .35s ease}
.step__sub{display:block;font-size:11.5px;color:var(--ink-3);margin-top:6px;
  max-height:0;opacity:0;overflow:hidden;transition:max-height .25s,opacity .25s,margin .25s}
.step[data-s="run"] .step__sub,.step[data-verify="1"] .step__sub{max-height:40px;opacity:1;margin-top:6px}
.step[data-verify="1"] .step__sub{color:var(--teal);font-weight:600}

/* done */
.donecard{width:100%;max-width:520px;text-align:center}
.donecard .card__body{padding:36px 32px 30px}
.donemark{width:72px;height:72px;border-radius:50%;background:var(--teal-tint);
  display:grid;place-items:center;margin:0 auto 20px;
  animation:pop .4s cubic-bezier(.2,.9,.3,1.3) both}
.donemark .msi{font-size:36px;color:var(--teal)}
.summary{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-ctl);
  margin:22px 0 16px;text-align:left}
.summary .r{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px}
.summary .r:last-child{border-bottom:0}
.summary .r span{color:var(--ink-2)}
.summary .r b{font-weight:650;font-variant-numeric:tabular-nums}
.donebtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.donebtns .btn{width:100%}

/* settings */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:16px 20px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .tx b{display:block;font-size:13.5px;font-weight:650}
.setrow .tx span{display:block;font-size:12px;color:var(--ink-3);margin-top:3px;line-height:1.5}
.sw{width:42px;height:24px;border-radius:999px;background:var(--line-2);position:relative;
  transition:background .18s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22);transition:transform .18s}
.sw.on{background:var(--blue)} .sw.on::after{transform:translateX(18px)}

/* toast */
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#22252A;color:#fff;font-size:13px;font-weight:550;padding:11px 18px;
  border-radius:var(--r-chip);box-shadow:0 8px 24px rgba(0,0,0,.22);
  display:flex;align-items:center;gap:8px;animation:toastin .26s cubic-bezier(.2,.9,.3,1.1) both}
.toast .msi{font-size:17px}
@keyframes toastin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* responsive */
@media (max-width:1080px){ .entry{grid-template-columns:1fr} .evid{position:static} }
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ============================================================
   Slim top bar (no sidebar)
   ============================================================ */
.bar{position:sticky;top:0;z-index:40;height:var(--topbar);
  background:rgba(247,247,245,.86);backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid transparent;transition:border-color .2s,background .2s}
.bar.stuck{border-bottom-color:var(--line);background:rgba(255,255,255,.9)}
.bar__in{max-width:920px;margin:0 auto;height:100%;padding:0 var(--pad);
  display:flex;align-items:center;gap:12px}
.bar__logo{display:flex;align-items:center;gap:9px;margin-right:auto;cursor:pointer}
.bar__logo img{height:26px;width:auto;display:block}
.bar__logo b{font-size:16px;font-weight:750;color:var(--navy);letter-spacing:.06em}

.seg{display:inline-flex;padding:2px;border-radius:var(--r-chip);
  background:var(--surface-3);border:1px solid var(--line)}
.seg button{height:26px;padding:0 11px;border-radius:var(--r-chip);
  font-size:11.5px;font-weight:650;color:var(--ink-3);transition:.14s}
.seg button:hover{color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--navy);box-shadow:0 1px 2px rgba(16,24,40,.09)}

.conn{display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;
  border-radius:var(--r-chip);background:var(--teal-tint);color:#0A6E64;
  font-size:12px;font-weight:600;border:1px solid rgba(15,157,143,.18)}
.conn.warn{background:var(--amber-tint);color:#8A4108;border-color:rgba(180,83,9,.2)}
.conn.off{background:var(--surface-3);color:var(--ink-3);border-color:var(--line)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.conn:not(.off) .dot{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.iconbtn{width:32px;height:32px;border-radius:var(--r-ctl);display:grid;place-items:center;
  color:var(--ink-3);transition:.13s}
.iconbtn:hover{background:var(--surface-3);color:var(--ink-2)}
.iconbtn.spin .msi{animation:spin .7s linear}
@keyframes spin{to{transform:rotate(360deg)}}

.usermenu{position:relative}
.userchip{display:flex;align-items:center;gap:8px;height:34px;padding:0 4px;
  border-radius:var(--r-chip);transition:background .13s}
.userchip:hover{background:var(--surface-3)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--brand-grad);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.menu{position:absolute;top:calc(100% + 8px);right:0;min-width:220px;z-index:50;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  box-shadow:var(--shadow-pop);padding:6px;display:none;animation:pop .16s cubic-bezier(.2,.9,.3,1.1) both}
.menu.on{display:block}
.menu__id{padding:10px 12px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu__id b{display:block;font-size:13px;font-weight:650}
.menu__id span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 12px;
  border-radius:6px;font-size:13px;font-weight:550;color:var(--ink-2);text-align:left;transition:.12s}
.menu button:hover{background:var(--surface-3);color:var(--ink)}
.menu button.danger{color:var(--red)}
.menu button.danger:hover{background:var(--red-tint)}
.menu .msi{font-size:18px;color:var(--ink-3)}
.menu button.danger .msi{color:var(--red)}

/* ============================================================
   Page frame
   ============================================================ */
main{display:block}
.wrap{max-width:920px;margin:0 auto;padding:8px var(--pad) 96px}
.view{display:none;animation:fade .24s ease both}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============================================================
   Hero — the big question
   ============================================================ */
.hero{padding:44px 0 32px}
.eyebrow{font-size:12px;font-weight:750;letter-spacing:.16em;color:var(--blue);
  text-transform:uppercase;margin-bottom:18px}
.hero h1{font-size:44px;line-height:1.24;letter-spacing:-.032em;font-weight:750;
  color:var(--navy);word-break:keep-all}
.hero p{margin-top:16px;font-size:16px;color:var(--ink-2);line-height:1.6;word-break:keep-all}

/* ============================================================
   업무 선택 — numbered list grouped by 비목 분류
   ============================================================ */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 12px 32px rgba(11,31,75,.06),0 2px 6px rgba(11,31,75,.03);overflow:hidden}
.panel__head{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.panel__head h2{font-size:16px;font-weight:700;letter-spacing:-.012em}
.panel__head .count{margin-left:auto;font-size:15px;font-weight:750;color:var(--blue);
  font-variant-numeric:tabular-nums}
.panel__search{padding:14px 22px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.search{position:relative}
.search .msi{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search .input{padding-left:40px;height:44px;font-size:14.5px;background:var(--surface)}

.grouphd{display:flex;align-items:center;gap:9px;padding:20px 22px 8px}
.grouphd .nm{font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--ink-2)}
.grouphd .n{font-size:11.5px;font-weight:650;color:var(--ink-3);font-variant-numeric:tabular-nums}
.grouphd::after{content:"";flex:1;height:1px;background:var(--line)}

.task{display:flex;align-items:center;gap:18px;width:100%;padding:15px 22px;text-align:left;
  border-bottom:1px solid var(--line);cursor:pointer;position:relative;
  transition:background .13s}
.task:hover{background:var(--surface-2)}
.task:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.task__no{width:30px;flex:none;font-size:13px;font-weight:650;color:#C3C8D0;
  font-variant-numeric:tabular-nums;letter-spacing:.04em}
.task__tx{flex:1;min-width:0}
.task__nm{display:block;font-size:19px;font-weight:700;letter-spacing:-.018em;color:var(--ink);
  word-break:keep-all;line-height:1.35}
.task__st{display:block;margin-top:5px;font-size:12.5px;color:var(--ink-3);
  word-break:keep-all;line-height:1.5}
.task__side{display:flex;align-items:center;gap:8px;flex:none}
.task__go{color:#D0D5DC;transition:color .13s,transform .13s}
.task:hover .task__go{color:var(--blue);transform:translateX(2px)}
.task--soon .task__nm{color:var(--ink-2)}
.task .star{opacity:0;transition:opacity .13s,background .13s,color .13s}
.task:hover .star,.task .star.on,.task .star:focus-visible{opacity:1}
@media (hover:none){ .task .star{opacity:1} }
.star{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  color:#D2D7DE;transition:.14s;flex:none}
.star:hover{background:var(--surface-3);color:var(--ink-3)}
.star.on{color:#E0952A}
.star.on .msi{font-variation-settings:'FILL' 1}
.emptyhint{padding:44px 22px;text-align:center;color:var(--ink-3);font-size:13.5px}

/* ============================================================
   업무 안내 — 그림으로 설명
   ============================================================ */
.back{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 8px;
  margin:20px 0 8px;border-radius:var(--r-chip);font-size:13px;font-weight:600;
  color:var(--ink-2);transition:.13s}
.back:hover{background:var(--surface-3);color:var(--ink)}

.guidehd{padding:6px 0 30px}
.guidehd h1{font-size:38px;line-height:1.24;letter-spacing:-.03em;font-weight:750;color:var(--navy)}
.guidehd p{margin-top:12px;font-size:16px;color:var(--ink-2);line-height:1.6;word-break:keep-all}

.sechd{display:flex;align-items:baseline;gap:10px;margin:40px 0 18px}
.sechd h2{font-size:22px;font-weight:750;letter-spacing:-.02em;color:var(--ink)}
.sechd span{font-size:13px;color:var(--ink-3)}

/* 4-panel illustrated flow */
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.flowstep{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:18px 16px 20px;position:relative;box-shadow:var(--shadow)}
.flowstep svg{display:block;width:100%;height:auto}
.flowstep .n{position:absolute;top:14px;left:16px;font-size:11.5px;font-weight:750;
  color:var(--blue);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.flowstep h3{margin-top:14px;font-size:16px;font-weight:700;letter-spacing:-.015em;
  color:var(--navy);word-break:keep-all}
.flowstep p{margin-top:7px;font-size:12.5px;color:var(--ink-2);line-height:1.55;word-break:keep-all}
.flowstep--you{border-color:#F1D9AE;background:linear-gradient(180deg,#FFFBF3 0%,var(--surface) 60%)}
.flowstep--you .n{color:var(--amber)}
.flowstep--you h3{color:#8A4108}
.flowtag{display:inline-flex;align-items:center;gap:5px;margin-top:11px;height:24px;padding:0 9px;
  border-radius:var(--r-chip);background:var(--amber-tint);color:#8A4108;font-size:11px;font-weight:700}

/* 필요 자료 — illustrated documents */
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(206px,1fr));gap:14px}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;transition:.2s}
.doc svg{display:block;width:56px;height:auto}
.doc h3{font-size:15px;font-weight:700;letter-spacing:-.012em;word-break:keep-all;line-height:1.4}
.doc p{font-size:12.5px;color:var(--ink-3);line-height:1.55;word-break:keep-all}
.doc__tag{margin-top:auto;display:inline-flex;align-items:center;gap:5px;height:24px;
  padding:0 9px;border-radius:var(--r-chip);font-size:11px;font-weight:700;align-self:flex-start}
.doc--must .doc__tag{background:var(--teal-tint);color:#0A6E64}
.doc--cond{background:var(--surface-2)}
.doc--cond .doc__tag{background:var(--surface-3);color:var(--ink-3)}
.doc--on{border-color:#F1D9AE;background:linear-gradient(180deg,#FFFBF3 0%,var(--surface) 70%)}
.doc--on .doc__tag{background:var(--amber-tint);color:#8A4108}

/* start CTA */
.startrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.startcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:24px 22px;text-align:left;box-shadow:var(--shadow);cursor:pointer;
  display:flex;flex-direction:column;gap:10px;transition:.16s}
.startcard:hover{border-color:var(--blue);transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(37,99,235,.13)}
.startcard .ic{width:46px;height:46px;border-radius:12px;background:var(--blue-tint);
  display:grid;place-items:center}
.startcard .ic .msi{font-size:23px;color:var(--blue)}
.startcard h3{font-size:19px;font-weight:750;letter-spacing:-.018em;color:var(--navy)}
.startcard p{font-size:13px;color:var(--ink-2);line-height:1.55;word-break:keep-all}
.startcard .go{margin-top:4px;font-size:13px;font-weight:650;color:var(--blue);
  display:flex;align-items:center;gap:4px}
.startcard--b .ic{background:var(--surface-3)} .startcard--b .ic .msi{color:var(--ink-2)}
.startcard--b .go{color:var(--ink-2)}

/* ============================================================
   Forms / tables reused on the flat layout
   ============================================================ */
.kv{display:grid;grid-template-columns:148px 1fr;border-top:1px solid var(--line)}
.kv > div{border-bottom:1px solid var(--line);display:flex;align-items:center;min-height:56px}
.kv .k{background:var(--surface-2);padding:0 16px;font-size:13px;font-weight:650;color:var(--ink-2);
  border-right:1px solid var(--line);white-space:nowrap}
.kv .v{padding:8px 14px}
.kv .v .input{height:40px;font-size:15px;border-color:transparent;background:transparent}
.kv .v .input:hover{border-color:var(--line);background:var(--surface)}
.kv .v .input:focus{border-color:var(--blue);background:var(--surface)}
.kv .v.readonly{font-size:16px;font-weight:700;padding-left:22px;gap:10px;display:flex;align-items:center}
@media (min-width:721px){ .kv{grid-template-columns:148px 1fr 148px 1fr}
  .kv .v{border-right:1px solid var(--line)} .kv .v:last-of-type{border-right:0} }

.att td{padding:6px 10px;height:auto;border-bottom:1px solid var(--line)}
.att td .input{height:38px;font-size:14px;border-color:transparent;background:transparent}
.att td .input:hover{border-color:var(--line);background:var(--surface)}
.att td .input:focus{border-color:var(--blue);background:var(--surface)}
.rowdel{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;color:var(--ink-3)}
.rowdel:hover{background:var(--red-tint);color:var(--red)}
.addrow,.addfile{margin:10px;width:calc(100% - 20px);height:44px;border:1px dashed var(--line-2);
  border-radius:var(--r-ctl);color:var(--ink-2);font-size:13.5px;font-weight:650;
  display:flex;align-items:center;justify-content:center;gap:6px;transition:.14s}
.addrow:hover,.addfile:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-tint)}
.stack{display:flex;flex-direction:column;gap:16px}

.drop{border:1.5px dashed var(--line-2);border-radius:14px;background:var(--surface);
  padding:40px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;
  cursor:pointer;transition:.16s}
.drop:hover,.drop.hot{border-color:var(--blue);background:var(--blue-tint)}
.drop .ic{width:52px;height:52px;border-radius:50%;background:var(--blue-tint);
  display:grid;place-items:center;margin-bottom:4px}
.drop .ic .msi{font-size:24px;color:var(--blue)}
.drop h3{font-size:16px;font-weight:700;color:var(--navy)}
.drop p{font-size:13px;color:var(--ink-3)}

.filerow{display:flex;align-items:center;gap:12px;padding:0 20px;height:60px;
  border-bottom:1px solid var(--line);animation:fade .2s ease both}
.filerow:last-of-type{border-bottom:0}
.filerow .fic{width:34px;height:34px;border-radius:8px;background:var(--blue-tint);
  display:grid;place-items:center;flex:none}
.filerow .fic .msi{font-size:18px;color:var(--blue)}
.filerow .meta{flex:1;min-width:0}
.filerow .meta b{display:block;font-size:13.5px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filerow .meta span{display:block;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.actionbar{position:sticky;bottom:0;margin:26px calc(var(--pad) * -1) -96px;
  padding:14px var(--pad);background:rgba(255,255,255,.93);
  backdrop-filter:saturate(180%) blur(10px);border-top:1px solid var(--line);z-index:20}
.actionbar__in{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:16px}
.actionbar .hint{font-size:13px;color:var(--ink-2)}
.actionbar .grp{display:flex;align-items:center;gap:10px;margin-left:auto}

/* progress + done reused */
.center{min-height:60vh;display:flex;align-items:center;justify-content:center}
.runcard{width:100%;max-width:560px}
.steps{display:flex;flex-direction:column;padding-left:4px}
.step{display:flex;gap:14px}
.step__rail{width:22px;display:flex;flex-direction:column;align-items:center;flex:none}
.step__ic{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);flex:none;
  display:grid;place-items:center;background:var(--surface);transition:.24s}
.step__ic .msi{font-size:13px;color:#fff;opacity:0;transition:opacity .2s}
.step__ln{flex:1;width:2px;background:var(--line);margin:3px 0;min-height:16px;transition:background .3s}
.step:last-child .step__ln{display:none}
.step__bd{display:block;flex:1;padding-bottom:18px;min-width:0}
.step__row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.step__nm{display:block;font-size:14.5px;font-weight:600;color:var(--ink-3);transition:.24s}
.step__t{display:block;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;
  opacity:0;transition:opacity .3s}
.step[data-s="done"] .step__ic{background:var(--teal);border-color:var(--teal)}
.step[data-s="done"] .step__ic .msi{opacity:1}
.step[data-s="done"] .step__nm{color:var(--teal)}
.step[data-s="done"] .step__t{opacity:1}
.step[data-s="done"] .step__ln{background:var(--teal)}
.step[data-s="run"] .step__ic{border-color:var(--blue);border-right-color:transparent;
  animation:spin .8s linear infinite}
.step[data-s="run"] .step__nm{color:var(--navy);font-weight:700}
.step__prog{display:block;height:4px;border-radius:4px;background:var(--line);overflow:hidden;
  max-height:0;opacity:0;transition:.25s}
.step[data-s="run"] .step__files .step__prog{max-height:10px;opacity:1;margin-top:9px}
.step__prog i{display:block;height:100%;width:0;background:var(--brand-grad);transition:width .35s ease}
.step__sub{display:block;font-size:12px;color:var(--ink-3);max-height:0;opacity:0;overflow:hidden;
  transition:.25s}
.step[data-s="run"] .step__sub,.step[data-verify="1"] .step__sub{max-height:40px;opacity:1;margin-top:6px}
.step[data-verify="1"] .step__sub{color:var(--teal);font-weight:650}

.donecard{width:100%;max-width:540px;text-align:center}
.donemark{width:76px;height:76px;border-radius:50%;background:var(--teal-tint);
  display:grid;place-items:center;margin:0 auto 20px;animation:pop .4s cubic-bezier(.2,.9,.3,1.3) both}
.donemark .msi{font-size:38px;color:var(--teal)}
.summary{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-ctl);
  margin:22px 0 16px;text-align:left}
.summary .r{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
.summary .r:last-child{border-bottom:0}
.summary .r span{color:var(--ink-2)}
.summary .r b{font-weight:700;font-variant-numeric:tabular-nums}
.donebtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.donebtns .btn{width:100%}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar .search{flex:1;min-width:200px;max-width:300px}
.toolbar .search .input{height:40px;font-size:14px}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:4px;padding:12px 16px}
.pg{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;
  font-size:13px;font-weight:650;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pg:hover{background:var(--surface-3)} .pg.on{background:var(--navy);color:#fff}
.tbl .nowrap{white-space:nowrap}

.setrow{display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:18px 22px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .tx b{display:block;font-size:14.5px;font-weight:650}
.setrow .tx span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:3px;line-height:1.5}
.sw{width:44px;height:25px;border-radius:999px;background:var(--line-2);position:relative;
  transition:background .18s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22);transition:transform .18s}
.sw.on{background:var(--blue)} .sw.on::after{transform:translateX(19px)}

/* modal + toast */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(21,23,25,.42);backdrop-filter:blur(2px);
  display:none;align-items:center;justify-content:center;padding:24px}
.scrim.on{display:flex;animation:fade .18s ease both}
.modal{width:100%;max-width:428px;background:var(--surface);border-radius:16px;
  box-shadow:var(--shadow-pop);overflow:hidden;animation:pop .24s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.modal__head{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--surface-2);
  display:flex;align-items:center;justify-content:space-between}
.modal__body{padding:30px 24px 26px;text-align:center}
.modal__foot{padding:12px 20px;border-top:1px solid var(--line);background:var(--surface-2);
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.authnum{width:128px;height:128px;margin:20px auto 0;border-radius:16px;border:2px solid var(--navy);
  background:var(--surface-2);display:grid;place-items:center;font-size:50px;font-weight:750;
  color:var(--navy);font-variant-numeric:tabular-nums;box-shadow:inset 0 1px 0 #fff,0 2px 10px rgba(11,31,75,.07)}
.authtimer{margin-top:16px;display:inline-flex;align-items:center;gap:6px;font-size:15px;
  font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.authtimer.warn{color:var(--amber)}
.authbar{width:200px;height:3px;border-radius:3px;background:var(--line);margin:12px auto 0;overflow:hidden}
.authbar i{display:block;height:100%;background:var(--blue);transition:width 1s linear}
.authbar.warn i{background:var(--amber)}

#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#22252A;color:#fff;font-size:13.5px;font-weight:550;padding:12px 18px;
  border-radius:var(--r-chip);box-shadow:0 8px 24px rgba(0,0,0,.22);
  display:flex;align-items:center;gap:8px;animation:toastin .26s cubic-bezier(.2,.9,.3,1.1) both}
.toast .msi{font-size:18px}
@keyframes toastin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ============================================================
   Login
   ============================================================ */
body.loginpage{display:flex;flex-direction:column;min-height:100vh;
  background:radial-gradient(880px 460px at 50% -14%,rgba(37,99,235,.10),transparent 62%),var(--bg)}
.loginbar{height:64px;display:flex;align-items:center;justify-content:flex-end;padding:0 24px;flex:none}
.loginmain{flex:1;display:flex;align-items:center;justify-content:center;padding:0 24px 56px}
.loginfootbar{flex:none;padding:0 24px 26px;text-align:center;font-size:12px;
  color:var(--ink-3);line-height:1.6}
.loginbox{width:100%;max-width:412px}
.loginbox .card__body{padding:36px 32px 30px}
.loginmark{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:26px}
.loginmark img{height:56px;width:auto}
.loginmark .wm b{display:block;font-size:20px;font-weight:750;color:var(--navy);letter-spacing:.14em;text-align:center}
.loginmark .wm span{display:block;margin-top:4px;font-size:9.5px;font-weight:550;
  color:var(--ink-3);letter-spacing:.16em;text-align:center}
.loginhint{margin-top:16px;display:flex;gap:8px;align-items:flex-start;font-size:12.5px;
  color:var(--ink-3);line-height:1.6}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--blue);cursor:pointer}
.err{display:none;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-ctl);
  background:var(--red-tint);color:#9B1414;font-size:12.5px;font-weight:550}
.err.on{display:flex;animation:fade .18s ease both}
.field > label{font-size:13px;font-weight:650;color:var(--ink-2)}
.input{height:44px;font-size:14.5px}
.btn{height:44px;font-size:14.5px}
.btn--sm{height:34px;font-size:13px}

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width:720px){
  :root{--pad:16px}
  .hero{padding:30px 0 24px}
  .hero h1{font-size:30px}
  .hero p{font-size:14.5px}
  .guidehd h1{font-size:27px}
  .guidehd p{font-size:14.5px}
  .sechd h2{font-size:19px}
  .flow{grid-template-columns:1fr 1fr}
  .startrow{grid-template-columns:1fr}
  .donebtns{grid-template-columns:1fr}
  .task{padding:14px 16px;gap:12px}
  .task__nm{font-size:17px}
  .task__no{width:24px;font-size:12px}
  .panel__head,.panel__search,.grouphd{padding-left:16px;padding-right:16px}
  .bar__in{padding:0 14px;gap:8px}
  .bar__logo b{display:none}
  .conn{padding:0 9px;font-size:11px}
  .seg button{padding:0 8px}
  .uname{display:none}
  .actionbar__in{flex-wrap:wrap}
  .actionbar .hint{width:100%}
}
@media (max-width:400px){ .flow{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ============================================================
   업무 카드 그리드 (아이콘 중심)
   ============================================================ */
.cathd{display:flex;align-items:center;gap:9px;margin:30px 0 12px}
.cathd .nm{display:inline-flex;align-items:center;height:26px;padding:0 11px;
  border-radius:7px;background:var(--surface-3);font-size:12px;font-weight:700;color:var(--ink-2)}
.cathd .n{font-size:12px;font-weight:650;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cathd::after{content:"";flex:1;height:1px;background:var(--line)}

.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tcard{position:relative;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:18px 16px 16px;cursor:pointer;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:10px;min-height:128px;
  transition:border-color .15s,box-shadow .15s,transform .15s}
.tcard:hover{border-color:var(--blue);transform:translateY(-2px);
  box-shadow:0 6px 18px rgba(37,99,235,.12)}
.tcard:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tcard .ic{width:44px;height:44px;border-radius:11px;background:var(--blue-tint);
  display:grid;place-items:center}
.tcard .ic .msi{font-size:23px;color:var(--blue)}
.tcard h3{font-size:15.5px;font-weight:700;letter-spacing:-.015em;color:var(--navy);
  word-break:keep-all;line-height:1.35;padding-right:26px}
.tcard p{font-size:12px;color:var(--ink-3);line-height:1.5;word-break:keep-all}
.tcard--soon{background:var(--surface-2)}
.tcard--soon .ic{background:var(--surface-3)}
.tcard--soon .ic .msi{color:var(--ink-3)}
.tcard--soon h3{color:var(--ink-2)}
.tcard .flagrow{margin-top:auto;padding-top:2px}
.tcard .star{position:absolute;top:12px;right:12px;opacity:0}
.tcard:hover .star,.tcard .star.on,.tcard .star:focus-visible{opacity:1}
@media (hover:none){ .tcard .star{opacity:1} }

/* favorites row on top */
.favband{margin-top:6px}
.favband .cardgrid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.tcard--fav{border-color:#EDDCB8;background:linear-gradient(180deg,#FFFDF6 0%,var(--surface) 70%)}
.tcard--fav:hover{border-color:var(--blue)}

/* toolbar row: search + filter tabs */
.pickbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:26px}
.pickbar .search{flex:1;min-width:220px;max-width:340px}
.pickbar .tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tab{height:34px;padding:0 15px;border-radius:var(--r-chip);border:1px solid var(--line);
  background:var(--surface);font-size:13px;font-weight:650;color:var(--ink-2);
  display:inline-flex;align-items:center;gap:6px;transition:.13s;cursor:pointer}
.tab:hover{background:var(--surface-2)}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tab .cnt{font-size:11.5px;opacity:.62;font-variant-numeric:tabular-nums}

/* ============================================================
   도움말 모달 (4단계 + 서류)
   ============================================================ */
.helpbtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;
  border-radius:var(--r-chip);border:1px solid var(--line);background:var(--surface);
  font-size:13px;font-weight:650;color:var(--ink-2);transition:.13s;cursor:pointer}
.helpbtn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-tint)}
.helpbtn .msi{font-size:18px}
.modal--wide{max-width:880px}
.modal--wide .modal__body{text-align:left;padding:24px;max-height:min(72vh,720px);overflow-y:auto}
.help__sec{font-size:15px;font-weight:750;letter-spacing:-.012em;margin:22px 0 12px;color:var(--ink)}
.help__sec:first-child{margin-top:0}
.help__sec span{font-size:12px;font-weight:550;color:var(--ink-3);margin-left:8px}
.modal--wide .flow{gap:12px}
.modal--wide .flowstep{padding:14px 14px 16px}
.modal--wide .flowstep h3{font-size:14px;margin-top:12px}
.modal--wide .flowstep p{font-size:11.5px}
.modal--wide .docs{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.modal--wide .doc{padding:14px}
.modal--wide .doc svg{width:46px}
.modal--wide .doc h3{font-size:13.5px}
.modal--wide .doc p{font-size:11.5px}
@media (max-width:720px){ .modal--wide .flow{grid-template-columns:1fr 1fr} }

/* upload screen: mode switch */
.modeswitch{display:flex;gap:8px;margin-bottom:18px}
.modeswitch .tab{height:38px;padding:0 18px;font-size:13.5px}

</style>

let LANG = 'ko';
const t = k => { const v=D[k]; return v ? (LANG==='ko'?v[0]:v[1]) : k; };
function applyStatic(root=document){
  root.querySelectorAll('[data-i18n]').forEach(el=>{ el.innerHTML=t(el.dataset.i18n); });
  root.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.placeholder=t(el.dataset.i18nPh); });
  document.documentElement.lang = LANG;
}
function readLang(){
  const q=new URLSearchParams(location.search).get('lang');
  if(q==='ko'||q==='en') return q;
  try{ const s=localStorage.getItem('aira.lang'); if(s==='ko'||s==='en') return s; }catch(e){}
  return 'ko';   /* 한국어 기본, 사용자가 고르면 그 선택을 기억 */
}
function saveLang(l){ try{ localStorage.setItem('aira.lang',l); }catch(e){} }

(function icons(){
  const p=document.createElement('span'); p.className='msi'; p.textContent='check';
  p.style.cssText='position:absolute;visibility:hidden;left:-9999px;font-size:20px;width:auto;height:auto';
  document.body.appendChild(p);
  const ok=()=>{ document.documentElement.classList.remove('noicons');
    const w=p.getBoundingClientRect().width; const g=w>0&&w<30;
    document.documentElement.classList.toggle('noicons',!g); return g; };
  if(ok()){ p.remove(); return; }
  let n=0; const iv=setInterval(()=>{ if(ok()||++n>30){ clearInterval(iv); p.remove(); } },200);
})();

function toast(msg, icon='check_circle'){
  const el=document.createElement('div'); el.className='toast';
  el.innerHTML=`<span class="msi">${icon}</span><span></span>`;
  el.lastChild.textContent=msg;
  $('#toasts').appendChild(el);
  setTimeout(()=>{el.style.transition='opacity .3s,transform .3s';
    el.style.opacity=0;el.style.transform='translateY(8px)';setTimeout(()=>el.remove(),320);},2400);
}

  $('#authNum').textContent=pad(Math.floor(Math.random()*99)+1);

    $('#authBar').firstChild.style.width=(left/180*100)+'%';

let runTimers=[];
function startRun(mode){
  if(!connected){ toast(t('no_session'),'lock'); openAuth(); return; }
  const n = mode==='excel' ? files.length : dFiles.length;
  const steps=[{k:'st_login'},{k:'st_nav'},{k:'st_fill',sub:t('st_fill_s')},
    {k:'st_attach',files:n},{k:'st_save'}];
  const label=s=>s.files!==undefined
    ? t('st_attach')+(s.files?` (0/${s.files})`:` (${t('st_skip')})`) : t(s.k);
  $('#steps').innerHTML=steps.map((s,i)=>`
    <div class="step" data-s="wait" data-i="${i}">
      <span class="step__rail"><span class="step__ic"><span class="msi">check</span></span>
        <span class="step__ln"></span></span>
      <span class="step__bd"><span class="step__row">
        <span class="step__nm">${label(s)}</span><span class="step__t"></span></span>
        <span class="${s.files?'step__files':''}"><span class="step__prog"><i></i></span></span>
        <span class="step__sub">${s.sub||''}</span></span></div>`).join('');
  go('run');
  runTimers.forEach(clearTimeout); runTimers=[];
  const clock=()=>{const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;};
  let acc=0;
  steps.forEach((s,i)=>{
    const dur = i===3 ? Math.max(1200, s.files*700) : 1000+Math.random()*500;
    runTimers.push(setTimeout(()=>{
      const el=$(`.step[data-i="${i}"]`); el.dataset.s='run';
      if(i===3 && s.files){
        const each=dur/s.files;
        for(let j=1;j<=s.files;j++) runTimers.push(setTimeout(()=>{
          $('.step__nm',el).textContent=`${t('st_attach')} (${j}/${s.files})`;
          $('.step__prog i',el).style.width=(j/s.files*100)+'%';
          $('.step__sub',el).textContent = j===s.files ? t('st_confirming')
            : t('st_uploading').replace('{j}',j);
        }, each*j-each*0.4));
      }
    }, acc));
    acc+=dur;
    runTimers.push(setTimeout(()=>{
      const el=$(`.step[data-i="${i}"]`); el.dataset.s='done';
      $('.step__t',el).textContent=clock();
      if(i===3 && s.files){ el.dataset.verify='1';
        $('.step__sub',el).textContent=t('st_verified').replace(/\{n\}/g,s.files); }
    }, acc));
  });
  runTimers.push(setTimeout(()=>{
    const amt = mode==='excel' ? 120000 : (Number(($('#f_amount').value||'').replace(/[^\d]/g,''))||0);
    $('#doneType').textContent=nameOf(currentTask);
    $('#doneAmt').textContent=won(amt);
    $('#doneFiles').textContent = n? t('done_files_v').replace(/\{n\}/g,n) : t('done_files_0');
    const d=new Date();
    HISTORY.unshift({d:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`,
      id:currentTask,doc:'2026-회의-00412',amt,md:mode==='excel'?'excel':'form',st:'saved'});
    fillSelects(); renderHistory(); go('done');
  }, acc+400));
}
function abortRun(){ runTimers.forEach(clearTimeout); runTimers=[]; toast(t('run_aborted'),'cancel'); go('guide'); }

    Object.keys(STK).map(k=>`<option value="${k}">${t(STK[k][0])}</option>`).join('');
  a.value=av; b.value=bv;
}
function renderHistory(){
  if(!$('#hBody')) return;
  const q=($('#hSearch').value||'').trim().toLowerCase();
  const it=$('#hItem').value, st=$('#hState').value;
  const rows=HISTORY.filter(r=>
    (!q||nameOf(r.id).toLowerCase().includes(q)||r.doc.toLowerCase().includes(q)) &&
    (!it||r.id===it) && (!st||r.st===st));
  $('#hBody').innerHTML = rows.length ? rows.map(r=>`<tr>
    <td class="num muted nowrap">${r.d}</td><td><b>${nameOf(r.id)}</b></td>
    <td class="num muted">${r.doc}</td>
    <td class="r num" style="font-weight:650">${won(r.amt)}</td>
    <td><span class="chip chip--grey">${t(MDK[r.md])}</span></td>
    <td><span class="chip ${STK[r.st][1]}">${t(STK[r.st][0])}</span></td></tr>`).join('')
   : `<tr><td colspan="6"><div class="emptyhint">${t('hist_none')}</div></td></tr>`;
}

$$('.drop').forEach(d=>{
  ['dragenter','dragover'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.add('hot')}));
  ['dragleave','drop'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.remove('hot')}));
  d.addEventListener('drop',()=>mockPick(true, d.closest('[data-view]').dataset.view==='direct'));
});

/* ── init ───────────────────────────────────────────────── */
(function init(){
  SEED.forEach(s=>$('#attBody').appendChild(attRow(s)));
  $('#f_date').value=new Date().toISOString().slice(0,10);
  $('#f_time').value='19:20';
  $('#f_purpose').value=LANG==='ko'?'2분기 실험설계 검토 회의':'Q2 experiment design review';
  $('#f_place').value=LANG==='ko'?'301동 세미나실':'Bldg 301 seminar room';
  $('#f_org').value=LANG==='ko'?'KIST 소재연구단':'KIST Materials';
  $('#f_purpose').addEventListener('input',recalc);
  setLang(readLang());
  go('start');
  setTimeout(()=>openAuth(),500);
})();

</script>
